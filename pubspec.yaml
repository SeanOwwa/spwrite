name: spwrite
description: "Spwrite — a cross-platform writing app with a project/folder/document sidebar, WYSIWYG editor, and local SQLite persistence."
publish_to: "none"
version: 1.3.4+6

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # SQLite via FFI for desktop (macOS, Windows, Linux) and for running the
  # store tests on the dev machine using the in-memory factory.
  sqflite_common_ffi: 2.4.3
  # Bundles the native sqlite3 library through pub for Windows/Linux desktop
  # builds, so no system libsqlite3 install is required (minimal-toolchain, Req 9.6).
  sqlite3_flutter_libs: 0.5.24
  # Per-platform writable directory resolution for the desktop database file.
  path_provider: 2.1.6
  # ChangeNotifier-based state management (single small pub dependency).
  provider: 6.1.5+1
  # Unique document identifiers (UUID v4).
  uuid: 4.6.0
  sqflite_common_ffi_web: ^1.0.1+2
  flutter_quill: 11.6.0
  markdown_quill: 4.3.0
  markdown: 7.3.1
  # Cross-platform file selection for character portraits (web, desktop). Flutter's first-party picker; opens the native file dialog and
  # returns an XFile whose bytes are stored with the character in SQLite. Used
  # instead of image_picker because image_picker's gallery source is not
  # supported on macOS/desktop, whereas file_selector works on every platform.
  file_selector: ^1.0.3
  # ZIP archive writing, used to assemble the .docx (OpenXML) package for the
  # DOCX export. Pure Dart, works on web.
  archive: ^3.6.1
  # Pure-Dart image decode / crop / resize / JPEG encode used to normalize a
  # project's cover photo to exactly 1600 × 2560 px (lib/data/
  # cover_image_normalizer.dart). Already a transitive dependency (via
  # flutter_launcher_icons); pinned to the locked version, which is compatible
  # with the archive 3.x line above. Runs on every platform including web.
  image: 4.3.0
  # Browser APIs (Blob, URL, anchor) for the web-only .docx download path in
  # lib/presentation/export/save_bytes_web.dart.
  web: ^1.1.0
  # HTTP client used for the one-time streaming download of the Local Model
  # (GGUF Model Asset) in lib/data/ai/model_downloader.dart. Streaming the
  # response body lets the download report byte-level progress and write to a
  # temp file without buffering the whole ~1 GB asset in memory (Req 3.2).
  http: 1.6.0
  # SHA-256 hashing used to verify the downloaded Model Asset against the
  # checksum in ModelCatalog before it is accepted, so a partial/corrupt file
  # is never loaded as if complete (Req 3.5).
  crypto: 3.0.7

  # Embedded local-model runtime (the LlmEngine backend, design §2).
  #
  # Rationale — why an in-process llama.cpp binding, not Ollama:
  #   * Offline / local-first: the app must be installable with Flutter alone,
  #     with no separate companion app (e.g. Ollama) to install or run. fllama
  #     wraps llama.cpp and runs the model *in this process* via native code /
  #     FFI, so the assistant works fully offline after setup (Req 3, design §2).
  #   * Flutter-only: it is a Flutter FFI plugin, so `flutter build` produces a
  #     self-contained desktop app; the user installs nothing else (Req 8.5).
  #   * One-time weights: only the GGUF Model Asset is downloaded, once, per
  #     ModelCatalog — the runtime binary ships with the app (Req 3).
  #   * Openly licensed: fllama is GPL-v2 (open source, dual-licensed); the
  #     chosen GGUF model is openly licensed and documented per Req 7.2 / 7.4.
  #     NOTE for maintainers: GPL-v2 is copyleft — Spwrite's own distribution
  #     must remain GPL-compatible while this dependency is linked. See Req 7.
  #
  # Pinned to an exact commit (not a moving branch) for reproducible builds.
  # This is the desktop-capable Telosnex binding (Flutter desktop via a native
  # build hook + vendored llama.cpp), which is git-only (`publish_to: none`),
  # hence a git dependency rather than a pub version. The concrete engine that
  # uses it lives behind the LlmEngine abstraction (lib/data/ai/), so the
  # runtime can be swapped without touching state/presentation (design §2).
  fllama:
    git:
      url: https://github.com/Telosnex/fllama.git
      ref: f624e4bfaf6c354d557ddc841ae4990760819c4a
  # Native memory helpers (malloc/free) for the llama.cpp embedding FFI binding
  # in lib/data/ai/llama_embedding_runtime.dart. Already a transitive
  # dependency; pinned to the locked version.
  ffi: 2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Property-based testing library (published on pub.dev as `kiri_check`).
  kiri_check: 1.3.1
  # Test primitives (test(), expect(), group()) imported directly by the
  # property/unit test files; declared explicitly since it is used directly.
  test: any
  # Virtual clock used to drive the connectivity probe's periodic timer
  # deterministically (task 4.2); imported directly so it is declared here
  # rather than relied on transitively via flutter_test.
  fake_async: 1.3.3
  # Recommended Flutter lint set referenced by analysis_options.yaml (pinned).
  flutter_lints: 6.0.0
  # Generates native launcher icons for every platform from the Spwrite logo.
  flutter_launcher_icons: ^0.14.4

# Native launcher-icon generation. Run `dart run flutter_launcher_icons` after
# changing the source image to regenerate icons for all platforms from the
# Spwrite logo.
flutter_launcher_icons:
  image_path: "assets/images/spwrite_logo.png"
  # Desktop
  macos:
    generate: true
    image_path: "assets/images/spwrite_logo.png"
  windows:
    generate: true
    image_path: "assets/images/spwrite_logo.png"
  # Web (favicon + PWA icons)
  web:
    generate: true
    image_path: "assets/images/spwrite_logo.png"
    background_color: "#0A0F1E"
    theme_color: "#0A0F1E"

flutter:
  uses-material-design: true

  # Bundle EB Garamond — a classic book serif — so the editor renders the same
  # literary typeface on every platform (including Flutter web, which does not
  # reliably resolve system font names like "Georgia"). These are variable-
  # weight TTFs; the upright file covers regular through bold and the italic
  # file covers the italic style. Licensed under the SIL Open Font License
  # (see assets/fonts/OFL.txt).
  assets:
    - assets/images/spwrite_logo.png

  fonts:
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-Variable.ttf
        - asset: assets/fonts/EBGaramond-Italic-Variable.ttf
          style: italic
