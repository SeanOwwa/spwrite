# Builds Spwrite for macOS, Windows and Linux at the same time on GitHub's
# machines (each desktop app must be built on its own operating system), then
# optionally publishes them to the website (SeanOwwa/spwrite.web).
#
# Builds: macOS (Apple Silicon, also runs on Intel), Windows ARM64 and x64,
# and Debian-based Linux ARM64 and x64.
#
# How to use:
#   - Build only: GitHub > Actions > "Build desktop apps" > Run workflow.
#     The five zips appear as artifacts on the run's page.
#   - Build and update the website: same, but tick "Publish to the website".
#   - Release: push a version tag, e.g.
#       git tag v1.3.5 && git push origin v1.3.5
#     The apps are attached to a GitHub Release AND published to the website,
#     together with that version's release notes from CHANGELOG.md.
#
# Publishing needs a repository secret named SPWRITE_WEB_TOKEN: a fine-grained
# personal access token with "Contents: Read and write" on SeanOwwa/spwrite.web.

name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the website (spwrite.web downloads)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Keep in step with the Flutter version used for local builds.
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  macos:
    name: macOS app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the app
        # ditto keeps the .app bundle's structure and permissions intact.
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent Spwrite.app "$GITHUB_WORKSPACE/Spwrite-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Spwrite-macos
          path: Spwrite-macos.zip

  windows:
    name: Windows app (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
          - arch: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter
        # Cloned (rather than flutter-action) so x64 and ARM64 install the same way.
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: flutter --version
      - run: flutter pub get
      - name: Build the AI engine with clang on ARM64
        # llama.cpp (bundled by fllama) refuses MSVC on ARM64 ("MSVC is not
        # supported for ARM, use clang"), which shows up as "Building native
        # assets failed". Make sure Visual Studio has its Clang tools, then
        # patch fllama's build hook to use the ClangCL toolset for Windows
        # ARM64 only. The rest of the app still builds with MSVC.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -products * -latest -property installationPath
          $clang = 'Microsoft.VisualStudio.Component.VC.Llvm.Clang'
          $toolset = 'Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset'
          $has = & $vswhere -products * -latest -requires $clang $toolset -property installationPath
          if (-not $has) {
            Write-Host "Adding Visual Studio's Clang tools to $vs ..."
            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$vs`"", '--add', $clang, '--add', $toolset,
              '--quiet', '--norestart', '--nocache')
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Visual Studio Installer failed ($($p.ExitCode))." }
          }
          dart run tool/patch_fllama_clangcl.dart
      - run: flutter build windows --release
      - name: Zip the Release folder
        # The whole folder is the app: spwrite.exe needs the files beside it
        # (including the bundled Visual C++ runtime DLLs).
        shell: pwsh
        run: |
          $release = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
            Where-Object { Test-Path (Join-Path $_.FullName 'spwrite.exe') } |
            Select-Object -First 1
          if (-not $release) { throw 'spwrite.exe was not found in the build output.' }
          Compress-Archive -Path "$($release.FullName)\*" -DestinationPath Spwrite-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Spwrite-windows-${{ matrix.arch }}
          path: Spwrite-windows-${{ matrix.arch }}.zip

  linux:
    name: Linux app (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux build tools
        # Same packages scripts/install.sh installs on apt systems. GCC
        # (build-essential) is needed to compile the bundled llama.cpp runtime.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build \
            pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev \
            libsecret-1-dev libglu1-mesa zip
      - name: Install Flutter
        # Cloned (rather than flutter-action) so x64 and ARM64 install the same way.
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Zip the app folder
        # The bundle folder is the app: run ./spwrite inside it. zip keeps the
        # executable permission, which unzip restores.
        run: |
          bundle=$(dirname "$(find build/linux -path '*/release/bundle/spwrite' -type f | head -n 1)")
          test -n "$bundle" || { echo "spwrite binary not found"; exit 1; }
          (cd "$(dirname "$bundle")" && zip -qry "$GITHUB_WORKSPACE/Spwrite-linux-${{ matrix.arch }}.zip" bundle)
      - uses: actions/upload-artifact@v4
        with:
          name: Spwrite-linux-${{ matrix.arch }}
          path: Spwrite-linux-${{ matrix.arch }}.zip

  release:
    name: Attach apps to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Spwrite ${{ github.ref_name }} (Beta)
          prerelease: true
          generate_release_notes: true
          files: dist/*

  website:
    name: Publish to the website
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check the website token
        env:
          TOKEN: ${{ secrets.SPWRITE_WEB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add a repository secret SPWRITE_WEB_TOKEN (a fine-grained token with Contents read and write on SeanOwwa/spwrite.web)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: SeanOwwa/spwrite.web
          token: ${{ secrets.SPWRITE_WEB_TOKEN }}
          path: site
      - uses: actions/download-artifact@v4
        with:
          path: builds
          merge-multiple: true
      - name: Copy the builds, update the download pages and the changelog
        run: |
          version=$(sed -nE 's/^version:[[:space:]]*([^+]+).*/\1/p' app/pubspec.yaml)
          echo "Publishing version $version"
          python3 app/scripts/publish_website.py --site site --builds builds \
            --changelog app/CHANGELOG.md --version "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Commit and push to spwrite.web
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A downloads update ./*.html
          if git diff --cached --quiet; then
            echo "The website already has these builds."
            exit 0
          fi
          git commit -m "Publish Spwrite Beta v$VERSION (downloads and release notes)"
          git push
